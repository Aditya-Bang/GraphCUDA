[build-system]
requires = [
    "setuptools>=80.9.0",
    "pybind11>=3.0.0",
    "numpy>=2.3.2",
    "torch==2.4.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "graphcuda"
version = "0.1.0"
description = "Optimized library for graph neural networks."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.3.2",
    "torch==2.4.1",
    "torch-geometric>=2.6.1",
    "scipy"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

# PyTorch CUDA 12.4 wheel index (used by uv for build and runtime).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
